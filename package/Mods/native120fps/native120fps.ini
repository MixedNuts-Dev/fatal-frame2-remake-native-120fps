; FATAL FRAME II: Crimson Butterfly REMAKE
; Native 120FPS Option - configuration / 設定ファイル

[General]
; 1 = enabled / 0 = disabled
; 1 = 有効 / 0 = 無効（無効にするとゲームは完全に素の状態で動きます）
Enabled=1

; 1 = write native120fps.log in this folder / 0 = no log
; 1 = このフォルダに native120fps.log を出力 / 0 = 出力しない
Log=1

[Patch]
; Internal text ID used for the third choice.
; The default (14278687 = 0x00D9E01F) points at an untranslated placeholder
; string that nothing in the game references, so the mod rewrites it to "120".
;
; 3つ目の選択肢に表示されるラベルの内部ID。
; 既定値 14278687 (0x00D9E01F) は、翻訳漏れのまま残っていた未使用の文字列枠です。
; どの項目からも参照されていないため、そこを "120" に書き換えて流用しています。
;
; Decimal only - hexadecimal is not supported here.
; ※ 十進数で記述してください（16進は使えません）
LabelId=14278687
