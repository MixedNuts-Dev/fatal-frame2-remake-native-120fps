[General]
; 1 = enabled / 0 = disabled
; 1 = 有効 / 0 = 無効（無効にするとゲームは完全に素の状態で動きます）
Enabled=1

; 1 = write native120fps.log in this folder / 0 = no log
; 1 = このフォルダに native120fps.log を出力 / 0 = 出力しない
Log=1

; Extra diagnostics, for bug reports only. Default 0.
; When set to 1, after patching the mod watches the game's frame rate index
; byte (0=30 / 1=60 / 2=120) for 15 minutes and logs it whenever it changes.
; It only READS one byte and never writes anything. Use this if 120 is
; selectable but the game still runs at 30 FPS, then attach the log.
;
; 不具合報告用の追加診断。既定値は 0。
; 1 にすると、パッチ後 15 分間、ゲーム側のフレームレート番号
; （0=30 / 1=60 / 2=120）を監視し、値が変わったときだけログに記録します。
; 読み取るのは 1 バイトだけで、書き込みは一切行いません。
; 「120 は選べるのに 30FPS になる」場合にこれを 1 にして、ログを添付して
; ください。
Diagnose=0

[Patch]
; Internal text ID used for the third choice.
; The default (14278687 = 0x00D9E01F) points at a string slot that nothing in
; the game's menus references, so the mod reuses it for the "120" label.
;
; 3つ目の選択肢に表示されるラベルの内部ID。
; 既定値 14278687 (0x00D9E01F) は、どのメニュー項目からも参照されていない
; 未使用の文字列枠です。そこを "120" に差し替えて流用しています。
;
; Decimal only - hexadecimal is not supported here.
; ※ 十進数で記述してください（16進は使えません）
LabelId=14278687

; Address (RVA) of the frame rate index byte, used only by Diagnose=1.
; Leave this alone unless an issue report asks you to change it.
;
; Diagnose=1 のときだけ使う、フレームレート番号の格納位置（RVA）。
; 不具合報告で指示された場合を除き、変更する必要はありません。
;
; 46340104 = 0x2C31808
FpsIndexRva=46340104
